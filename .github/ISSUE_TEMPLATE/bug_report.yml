name: Bug report
description: Something is wrong, missing or confusing in a scan or report.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: wiringmap build . --open
  - type: input
    id: project
    attributes:
      label: Project
      description: A link to the project you mapped, if it is public. Please do not paste private code.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `wiringmap --version` and `python --version`, and your operating system.
      placeholder: wiringmap 0.1.0, Python 3.12.2, Ubuntu 24.04
    validations:
      required: true
