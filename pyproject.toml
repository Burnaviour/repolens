[project]
name = "repolens"
version = "0.1.0"
description = "See how your (vibe-coded) codebase fits together: offline, interactive, AI optional."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Burnaviour", email = "meharmuzafar760@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["visualization", "code-graph", "static-analysis", "architecture", "llm", "ollama"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pathspec>=0.12",
    "rich>=13.7",
    "tomli>=2 ; python_full_version < '3.11'",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Burnaviour/repolens"
Issues = "https://github.com/Burnaviour/repolens/issues"

[project.scripts]
repolens = "repolens.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]  # sample code, including a deliberate syntax error

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
